name: Build and Deploy to Azure

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Build Docker image
        run: docker build -t conecta-ciudad:latest .

      - name: Login to Azure Container Registry
        run: |
          echo ${{ secrets.ACR_PASSWORD }} | docker login ${{ secrets.ACR_NAME }}.azurecr.io \
            --username ${{ secrets.ACR_USERNAME }} \
            --password-stdin

      - name: Tag and Push Docker image
        run: |
          docker tag conecta-ciudad:latest ${{ secrets.ACR_NAME }}.azurecr.io/conecta-ciudad:latest
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/conecta-ciudad:latest

      - name: Trigger Azure WebApp Update
        run: |
          curl -X POST '${{ secrets.WEBHOOK_URL }}'
