name: Build and Deploy to Azure

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      # Tag único para evitar cache
      - name: Generate unique tag
        id: tag
        run: |
          TAG="v$(date +%Y%m%d.%H%M%S)"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Building with tag: $TAG"

      - name: Build Docker image
        run: |
          docker build \
            --no-cache \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            --build-arg VCS_REF=$GITHUB_SHA \
            -t conecta-ciudad:${{ steps.tag.outputs.TAG }} .

      - name: Login to Azure Container Registry
        run: |
          echo ${{ secrets.ACR_PASSWORD }} | docker login ${{ secrets.ACR_NAME }}.azurecr.io \
            --username ${{ secrets.ACR_USERNAME }} \
            --password-stdin

      - name: Push Docker images
        run: |
          IMAGE_NAME="${{ secrets.ACR_NAME }}.azurecr.io/conecta-ciudad"

          # Push con tag único
          docker tag conecta-ciudad:${{ steps.tag.outputs.TAG }} ${IMAGE_NAME}:${{ steps.tag.outputs.TAG }}
          docker push ${IMAGE_NAME}:${{ steps.tag.outputs.TAG }}

          # Push como latest
          docker tag conecta-ciudad:${{ steps.tag.outputs.TAG }} ${IMAGE_NAME}:latest
          docker push ${IMAGE_NAME}:latest

          echo "Images pushed successfully"
          echo "   - ${IMAGE_NAME}:${{ steps.tag.outputs.TAG }}"
          echo "   - ${IMAGE_NAME}:latest"

      # Despliega usando Publish Profile
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ secrets.ACR_NAME }}.azurecr.io/conecta-ciudad:${{ steps.tag.outputs.TAG }}

      - name: Wait for deployment
        run: |
          echo "Waiting 60 seconds for app to fully start..."
          sleep 60
          echo "Deployment completed!"
          echo "Version deployed: ${{ steps.tag.outputs.TAG }}"
