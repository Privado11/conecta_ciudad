name: Build and Deploy to Azure

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
      
      - name: Build with Maven
        run: mvn clean package -DskipTests
      
      # CRÍTICO: Usa timestamp en el build para forzar cambios
      - name: Build Docker image with timestamp
        id: build
        run: |
          TIMESTAMP=$(date +%s)
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_OUTPUT
          
          docker build \
            --no-cache \
            --build-arg CACHEBUST=$TIMESTAMP \
            -t conecta-ciudad:latest .
          
          echo "Built with timestamp: $TIMESTAMP"
      
      - name: Login to Azure Container Registry
        run: |
          echo ${{ secrets.ACR_PASSWORD }} | docker login ${{ secrets.ACR_NAME }}.azurecr.io \
            --username ${{ secrets.ACR_USERNAME }} \
            --password-stdin
      
      - name: Tag and Push Docker image
        run: |
          # Tag con timestamp para forzar nuevo digest
          docker tag conecta-ciudad:latest ${{ secrets.ACR_NAME }}.azurecr.io/conecta-ciudad:build-${{ steps.build.outputs.TIMESTAMP }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/conecta-ciudad:build-${{ steps.build.outputs.TIMESTAMP }}
          
          # Tag y push como latest
          docker tag conecta-ciudad:latest ${{ secrets.ACR_NAME }}.azurecr.io/conecta-ciudad:latest
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/conecta-ciudad:latest
          
          echo "Pushed: build-${{ steps.build.outputs.TIMESTAMP }} and latest"
      
      # Trigger webhook (si está configurado)
      - name: Trigger Azure Webhook
        run: |
          if [ -n "${{ secrets.WEBHOOK_URL }}" ]; then
            curl -X POST '${{ secrets.WEBHOOK_URL }}' || echo "Webhook failed"
          else
            echo "Webhook URL not configured, skipping..."
          fi
      
      - name: Wait for Azure CD
        run: |
          echo "⏳ Waiting 120 seconds for Azure Continuous Deployment to pull new image..."
          echo "   If CD is enabled, Azure should automatically detect the new 'latest' tag"
          sleep 120
          echo "Check your app now!"