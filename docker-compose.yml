version: '3.9'

services: 
  db:
    image: mysql:8.0-debian
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - conecta_ciudad_network

volumes:
  db_data:
networks:
  conecta_ciudad_network: