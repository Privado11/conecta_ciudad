# Production Profile - Environment Variables
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=${POSTGRES_SSLMODE}&currentSchema=${POSTGRES_SCHEMA}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Production Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${POSTGRES_SCHEMA}
spring.jpa.properties.hibernate.format_sql=false

# Flyway Production
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=${POSTGRES_SCHEMA}
spring.flyway.locations=classpath:db/migration

# Timezone
spring.jackson.time-zone=America/Bogota
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# Production specific settings
logging.level.org.hibernate.SQL=WARN
