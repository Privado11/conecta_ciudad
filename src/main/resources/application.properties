# Datasource
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=${POSTGRES_SSLMODE}&currentSchema=${POSTGRES_SCHEMA}&channel_binding=require
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${POSTGRES_SCHEMA}
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=${POSTGRES_SCHEMA}
spring.flyway.locations=classpath:db/migration

# === LOGGING AVANZADO PARA DEPURAR ===

# Muestra las consultas SQL generadas por Hibernate
logging.level.org.hibernate.SQL=DEBUG

# Muestra los valores de los parámetros (ej: "binding parameter [1] as [VARCHAR] - [%admin%]")
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Muestra cómo Hibernate transforma JPQL a SQL nativo
logging.level.org.hibernate.orm.query=DEBUG

# (opcional) Ver toda la ejecución del EntityManager
logging.level.org.springframework.orm.jpa=DEBUG

# (opcional) Ver SQL con tipo de datos detectado
logging.level.org.hibernate.engine.jdbc.spi.SqlStatementLogger=DEBUG
